name: Sync typhoon data

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-data.mjs'
      - 'scripts/source.mjs'
      - 'tests/**'
      - '.github/workflows/update-and-deploy.yml'

permissions:
  contents: write

concurrency:
  group: typhoon-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Test data normalization
        run: node --test tests/*.test.mjs
      - name: Collect latest source data
        id: collect
        continue-on-error: true
        run: node scripts/fetch-data.mjs
      - name: Save data snapshot in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'data: update Hainan typhoon snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report collection failure after saving status
        if: steps.collect.outcome == 'failure'
        run: exit 1
