name: Build Flutter and deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-pages.yml'

permissions:
  contents: read

concurrency:
  group: typhoon-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Test startup and resource budget
        run: node --test test_web/*.test.mjs
      - run: flutter analyze
      - run: flutter test
      - name: Build approved Flutter website
        run: flutter build web --release --no-web-resources-cdn --no-wasm-dry-run --base-href /typhoon-observer-live/
      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/build/web
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
